# Let NetworkManager manage all devices on this system
network:
  version: 2
  #renderer: NetworkManager
  renderer: networkd
  ethernets:
    enp5s0:
      dhcp4: false
      dhcp6: false
      match:
        macaddress: d0:50:99:2c:f0:e1
      addresses:
        - 192.168.10.2/24
      routes:
        - to: default
          via: 192.168.10.1
      nameservers:
        addresses: [8.8.8.8, 8.8.4.4]
      set-name: Ethernet
      link-local: [ ]